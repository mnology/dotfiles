set -g status-style "bg=default,fg=white"
set -g status-left-length 40
set -g status-right-length 80
setw -g window-status-separator " "

set -g status-left "#[fg=brightred,bg=default]#[bg=brightred,fg=black,bold] #S #[fg=brightred,bg=default,nobold] "

setw -g window-status-format "#[fg=brightblack,bg=default]#[bg=brightblack,fg=white] #I:#W#F #[fg=brightblack,bg=default]"
setw -g window-status-current-format "#[fg=blue,bg=default]#[bg=blue,fg=black,bold] #I:#W#F #[fg=blue,bg=default,nobold]"
setw -g window-status-activity-style "fg=yellow,bold"

set -g status-right "#[fg=brightblack,bg=default]#[bg=brightblack,fg=white] %Y-%m-%d %H:%M #[fg=yellow,bg=brightblack]#[bg=yellow,fg=black,bold] #h #[fg=yellow,bg=default,nobold]"
set -g status-position top
set -g status-interval 5
