# tmux status bar. Colors come from ~/.config/tmux/tinty-colors.conf, which
# bin/starship-tinty.py generates per scheme (the same adaptive accents the
# starship prompt uses), so prompt and status share one palette. Source the
# fragment first; -q stays quiet before it is generated (fresh machine).
#
# Shape: rounded caps at the far ends; solid powerline arrows between pills; a
# solid divider arrow leads each inactive tab; thin arrows mark window-list
# overflow. The current window is a filled accent pill with its own caps.
# Roles: session=seg1  host=seg2  current window=seg4 (bg)  activity=seg3 (bg)
#   bar surface=base03  divider=base05  clock=base01
source-file -q ~/.config/tmux/tinty-colors.conf

set -g status-style "bg=#{@tinty_bar_bg},fg=#{@tinty_bar_fg}"
set -g status-left-length 60
set -g status-right-length 80
set -g status-position top
set -g status-interval 5

# session pill: round open, seg1, solid arrow into the window-list surface bg.
set -g status-left "#[fg=#{@tinty_session_bg},bg=default]#[bg=#{@tinty_session_bg},fg=#{@tinty_session_fg},bold] #S #[fg=#{@tinty_session_bg},bg=#{@tinty_bar_bg}]"

# window list: all windows share the surface bg so the chain is seamless; the
# window list: inactive tabs share the bar bg; a solid divider arrow leads each
# one (baked into the format, not the separator, so its inline fg applies). The
# current window is a filled accent pill with its own caps.
# window-status-style sets the surface bg as the region base, so the gaps
# the separator sits in never fall back to the terminal default (black).
setw -g window-status-style "fg=#{@tinty_bar_fg},bg=#{@tinty_bar_bg}"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#{@tinty_divider},bg=#{@tinty_bar_bg}]#[fg=#{?window_activity_flag,#{@tinty_activity_fg},#{@tinty_bar_fg}},bg=#{?window_activity_flag,#{@tinty_activity_bg},#{@tinty_bar_bg}},#{?window_activity_flag,bold,nobold}] #I:#W#F "
setw -g window-status-current-format "#[fg=#{@tinty_window_bg},bg=#{@tinty_bar_bg}]#[fg=#{@tinty_window_fg},bg=#{@tinty_window_bg},bold] #I:#W#F #[fg=#{@tinty_window_bg},bg=#{@tinty_bar_bg},nobold]"
setw -g window-status-activity-style "fg=#{@tinty_activity_fg},bg=#{@tinty_activity_bg},bold"

# right group: left-pointing arrows (right-aligned). surface clock pill flows
# into the seg2 host pill, closed by a round cap.
set -g status-right "#[fg=#{@tinty_clock_bg},bg=default]#[bg=#{@tinty_clock_bg},fg=#{@tinty_clock_fg}] %Y-%m-%d %H:%M #[fg=#{@tinty_host_bg},bg=#{@tinty_clock_bg}]#[bg=#{@tinty_host_bg},fg=#{@tinty_host_fg},bold] #h #[fg=#{@tinty_host_bg},bg=default,nobold]"

# Override status-format[0] only to theme the window-list overflow markers
# (the default <,> become thin powerline arrows). Based on the tmux 3.6 default.
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]#[fg=#{@tinty_window_bg},bg=#{@tinty_bar_bg}]#[norange default]#[list=right-marker]#[fg=#{@tinty_window_bg},bg=#{@tinty_bar_bg}]#[norange default]#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
