"$schema" = "https://starship.rs/config-schema.json"

# This file is a TEMPLATE. bin/starship-tinty.py regenerates the palette block
# below on every `tinty apply` and writes the result to $STARSHIP_CONFIG (the
# live, untracked config starship reads). Segments reference base roles, so the
# bar flows with any base16/base24 scheme. Per-segment foregrounds (ink_*) are
# resolved by WCAG contrast, so text stays legible on light or dark segment
# backgrounds. Edit structure here; never edit the live file.

format = """
[](seg1)\
$os\
$username\
[](bg:seg2 fg:seg1)\
$directory\
[](fg:seg2 bg:seg3)\
$git_branch\
$git_status\
[](fg:seg3 bg:seg4)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:seg4 bg:base01)\
$docker_context\
$conda\
[](fg:base01 bg:base00)\
$time\
[ ](fg:base00)\
$line_break$character"""

palette = "base24"

# >>> TINTY PALETTE >>>
[palettes.base24]
# Default values (base24 tokyo-night-moon-ish). Overwritten per scheme by
# bin/starship-tinty.py: base roles come from the scheme; seg1-4 are the
# hue-bearing bar segments the generator picks from the scheme's accents by
# saturation; ink_* are contrast-picked foregrounds. Do not hand-edit.
base00 = "#222436"
base01 = "#1e2030"
base02 = "#2d3f76"
base03 = "#3b4261"
base04 = "#636da6"
base05 = "#828bb8"
base06 = "#aeb4d1"
base07 = "#c8d3f5"
base08 = "#ff757f"
base09 = "#ffc777"
base0a = "#ffdf77"
base0b = "#c3e88d"
base0c = "#86e1fc"
base0d = "#82aaff"
base0e = "#fca7ea"
base0f = "#c53b53"
seg1 = "#ffc777"
ink_seg1 = "#222436"
seg2 = "#ffdf77"
ink_seg2 = "#222436"
seg3 = "#86e1fc"
ink_seg3 = "#222436"
seg4 = "#82aaff"
ink_seg4 = "#222436"
ink_tool = "#c8d3f5"
ink_time = "#c8d3f5"
# <<< TINTY PALETTE <<<

[os]
disabled = false
style = "bg:seg1 fg:ink_seg1"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:seg1 fg:ink_seg1"
style_root = "bg:seg1 fg:ink_seg1"
format = "[ $user ]($style)"

[directory]
style = "fg:ink_seg2 bg:seg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:seg3"
format = "[[ $symbol $branch ](fg:ink_seg3 bg:seg3)]($style)"

[git_status]
style = "bg:seg3"
format = "[[($all_status$ahead_behind )](fg:ink_seg3 bg:seg3)]($style)"

[nodejs]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[c]
symbol = " "
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[rust]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[golang]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[php]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[java]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[kotlin]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[haskell]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[python]
symbol = ""
style = "bg:seg4"
format = "[[ $symbol( $version) ](fg:ink_seg4 bg:seg4)]($style)"

[docker_context]
symbol = ""
style = "bg:base01"
format = "[[ $symbol( $context) ](fg:bright-blue bg:base01)]($style)"

[conda]
style = "bg:base01"
format = "[[ $symbol( $environment) ](fg:bright-blue bg:base01)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:base00"
format = "[[  $time ](fg:ink_time bg:base00)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](bold fg:base0b)"
error_symbol = "[](bold fg:base08)"
vimcmd_symbol = "[](bold fg:base0b)"
vimcmd_replace_one_symbol = "[](bold fg:base0e)"
vimcmd_replace_symbol = "[](bold fg:base0e)"
vimcmd_visual_symbol = "[](bold fg:seg2)"
