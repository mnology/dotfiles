set -g mouse on
set -g history-limit 100000
set -s set-clipboard on

set-option -sg escape-time 10
set-option -g focus-events on

set -g default-terminal "tmux-256color"
# Advertise truecolor to apps running inside tmux, and to the status line.
# tmux 3.2+ prefers terminal-features over the old terminal-overrides ":Tc".
# Without this, tmux downsamples 24-bit `48;2;r;g;b` to 256-color, which looks
# flat or collapses light/dark colours (status text goes muddy or black).
# The client TERM is what matters: WezTerm reports xterm-256color, kitty
# reports xterm-kitty. Name both explicitly; a bare xterm* glob does not
# reliably set RGB for the status line.
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:RGB"
# Belt and suspenders: the older Tc override, which some tmux builds honor more
# reliably for the status line than terminal-features. Harmless alongside RGB.
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",xterm-kitty:Tc"
set -g default-command /usr/bin/zsh

# Let tinted-shell OSC color escapes pass through tmux (live terminal retheme).
set -g allow-passthrough on

set -g base-index 1
set -g pane-base-index 1

setw -g automatic-rename on
setw -g monitor-activity on

# Name a window by its directory when the shell is idle, by the running command
# otherwise. #{b:...} is the path basename. The default format shows the
# command, so an idle shell reads "zsh" on every window; this swaps in the dir.
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# tpack
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

source-file ~/.tmux/status.conf

run '~/.tmux/plugins/tpm/tpm'
