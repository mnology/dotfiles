set -g mouse on
set -g history-limit 100000
set -s set-clipboard on

set-option -sg escape-time 10
set-option -g focus-events on

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",*256col*:Tc"
set -g default-command /usr/bin/zsh

# Let tinted-shell OSC color escapes pass through tmux (live terminal retheme).
set -g allow-passthrough on

set -g base-index 1
set -g pane-base-index 1

setw -g automatic-rename on
setw -g monitor-activity on

# Name a window by its directory when the shell is idle, by the running command
# otherwise. #{b:...} is the path basename. The default format shows the
# command, so an idle shell reads "zsh" on every window; this swaps in the dir.
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# tpack
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

source-file ~/.tmux/status.conf

run '~/.tmux/plugins/tpm/tpm'
